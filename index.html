<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오키나와 완벽 맞춤형 여행 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet.js (오픈소스 무료 지도) CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Leaflet 지도 팝업 커스텀 스타일 */
        .leaflet-popup-content-wrapper { border-radius: 8px; }
        .leaflet-popup-content { margin: 10px; font-family: inherit; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans relative">

    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-600 to-blue-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure"></i> 오키나와 자유여행 플래너
                </h1>
                <p class="text-cyan-100 mt-1">순서 기반 일정 관리 및 오픈소스 맵 연동</p>
            </div>
            <!-- 항공 및 날짜 설정 바 -->
            <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm flex flex-wrap gap-3 items-center text-sm">
                <div>
                    <label class="block text-xs text-cyan-200">출발 날짜</label>
                    <input type="date" id="startDate" value="2026-12-27" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <div>
                    <label class="block text-xs text-cyan-200">귀국 날짜</label>
                    <input type="date" id="endDate" value="2026-12-31" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <button onclick="updateTripSettings()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-3 py-1.5 rounded font-bold transition shadow self-end">설정 저장</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-0 py-6 sm:py-8">
        <!-- My Trip Planner -->
        <div class="bg-white sm:rounded-2xl py-5 sm:py-6 shadow-sm border-y sm:border border-slate-100">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 px-4 sm:px-6">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-suitcase-rolling text-cyan-600"></i>오키나와 일정
                </h2>
                <span id="trip-info-badge" class="text-sm bg-cyan-100 text-cyan-800 px-3 py-1.5 rounded-lg font-bold"></span>
            </div>

            <!-- Day 탭 -->
            <div class="mb-6 px-4 sm:px-6">
                <div class="bg-slate-50 rounded-xl border border-slate-200 p-2 shadow-inner w-full">
                    <div id="day-tabs" class="grid grid-cols-4 gap-1.5 w-full"></div>
                </div>
            </div>

            <!-- 메인 컨텐츠 영역 -->
            <div id="day-content" class="space-y-4"></div>
        </div>
    </main>

    <!-- 내장 지도 모달 -->
    <div id="integratedMapModal" class="hidden fixed inset-0 z-[80] bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-4xl h-[85vh] shadow-2xl flex flex-col overflow-hidden">
            <div class="bg-gradient-to-r from-slate-700 to-slate-900 px-5 py-3 flex justify-between items-center text-white shrink-0">
                <h3 id="integratedMapTitle" class="font-bold text-base"><i class="fa-solid fa-map mr-2"></i>지도에서 한눈에 보기</h3>
                <button onclick="closeIntegratedMap()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="flex-1 w-full relative">
                <!-- Leaflet 지도가 렌더링될 영역 -->
                <div id="leafletMapContainer" class="absolute inset-0 z-0"></div>
            </div>
        </div>
    </div>

    <!-- Timeline Add Modal -->
    <div id="timelineAddModal" class="hidden fixed inset-0 z-[50] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col h-[92vh]">
            <div class="bg-gradient-to-r from-cyan-600 to-blue-700 px-6 py-4 flex justify-between items-center text-white shrink-0">
                <h3 id="modal-title" class="font-bold text-lg"><i class="fa-solid fa-calendar-plus mr-2"></i>방문 순서에 장소 추가</h3>
                <button onclick="closeTimelineAddModal()" class="text-white/80 hover:text-white transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>

            <div class="p-6 overflow-y-auto bg-slate-50 flex-1 space-y-5 hide-scrollbar">
                <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                    <span class="text-sm font-bold text-slate-700">원하는 장소를 직접 등록하기</span>
                    <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-plus"></i> 직접 등록
                    </button>
                </div>

                <!-- 지역 탭 -->
                <div class="flex bg-slate-200/70 p-1 rounded-xl">
                    <button onclick="switchRegion('south')" id="btn-south" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-white text-cyan-700 shadow-sm">남부</button>
                    <button onclick="switchRegion('central')" id="btn-central" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800">중부</button>
                    <button onclick="switchRegion('north')" id="btn-north" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800">북부</button>
                </div>

                <!-- 카테고리 탭 -->
                <div class="flex flex-wrap gap-2">
                    <button onclick="switchCategory('관광지')" id="cat-관광지" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-cyan-600 text-white shadow-sm">관광지</button>
                    <button onclick="switchCategory('식당')" id="cat-식당" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">식당</button>
                    <button onclick="switchCategory('카페')" id="cat-카페" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">카페</button>
                    <button onclick="switchCategory('쇼핑')" id="cat-쇼핑" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">쇼핑</button>
                    <button onclick="switchCategory('액티비티')" id="cat-액티비티" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">액티비티</button>
                    <button onclick="switchCategory('호텔')" id="cat-호텔" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">호텔</button>
                </div>

                <!-- 현재 목록 지도 뷰 버튼 -->
                <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                    <span class="text-xs font-bold text-slate-500">아래 목록을 지도에서 확인해보세요.</span>
                    <button onclick="openIntegratedMap('list')" class="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-map-location-dot"></i> 목록 지도 뷰
                    </button>
                </div>

                <!-- 장소 카드 목록 -->
                <div id="places-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- JS 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Place Modal -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[60] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base"><i class="fa-solid fa-plus-circle mr-2"></i>새로운 장소 / 호텔 직접 등록</h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4 h-[75vh] sm:h-auto overflow-y-auto">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">장소명 / 숙소명</label>
                    <input type="text" id="customPlaceName" placeholder="예: 블루씰 아이스크림" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">지역</label>
                        <select id="customPlaceRegion" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                            <option value="south">남부</option>
                            <option value="central">중부</option>
                            <option value="north">북부</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">분류</label>
                        <select id="customPlaceGroup" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                            <option value="관광지">관광지</option>
                            <option value="식당">식당</option>
                            <option value="카페" selected>카페</option>
                            <option value="쇼핑">쇼핑</option>
                            <option value="액티비티">액티비티</option>
                            <option value="호텔">호텔</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">장소 설명 (선택)</label>
                    <textarea id="customPlaceDesc" rows="2" placeholder="구글맵에서 확인한 설명이나 메모를 입력하세요." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">
                        <i class="fa-solid fa-map-pin mr-1 text-rose-500"></i>위도 / 경도 좌표 (선택 입력)
                    </label>
                    <p class="text-[11px] text-slate-400 mb-1.5">구글 맵의 위도,경도를 그대로 붙여넣거나 각각 입력하세요.</p>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="customLat" placeholder="위도 (예: 26.1738)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" oninput="handleCustomCoordPaste(event)">
                        <input type="text" id="customLng" placeholder="경도 (예: 127.6429)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500">
                    </div>
                </div>
                
                <div class="pt-1">
                    <a href="https://www.google.com/maps/search/?api=1&query=오키나와" target="_blank" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 transition">
                        <i class="fa-solid fa-map-location-dot"></i> 구글 맵에서 위치 찾기 / 좌표 복사
                    </a>
                </div>

                <div class="pt-3 flex gap-2">
                    <button onclick="registerCustomPlace()" id="customAddBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-sm">
                        등록하기
                    </button>
                    <button onclick="closeAddModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2.5 rounded-lg font-bold text-sm transition">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Leaflet.js 아이콘 초기화 (오류 안전 체크 추가)
        if (typeof L !== 'undefined') {
            delete L.Icon.Default.prototype._getIconUrl;
            L.Icon.Default.mergeOptions({
                iconRetinaUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png',
                iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
            });
        }

        const defaultPlacesData = {
            south: [
                { id: 's_att1', group: '관광지', name: '나하 공항', category: '교통/시작점', desc: '오키나와 남부 여행의 시작점이 되는 관문 공항.', lat: 26.2056, lng: 127.6472 },
                { id: 's_att2', group: '관광지', name: '슈리성', category: '역사유적', desc: '류큐 왕국의 화려한 궁전 유적으로 붉은 성곽과 전통 건축미를 자랑하는 역사적 명소입니다.', lat: 26.2253, lng: 127.7197 },
                { id: 's_att3', group: '관광지', name: '국제거리', category: '번화가', desc: '나하 최대의 번화가로 기념품 샵, 맛집, 돈키호테 등이 밀집해 있는 쇼핑의 거리입니다.', lat: 26.2150, lng: 127.6882 },
                { id: 's_att4', group: '카페', name: 'ZHYVAGO COFFEE ROASTERY (나하)', category: '카페', desc: '오키나와 감성 가득한 해안가 로스터리 카페입니다.', lat: 26.3200, lng: 127.7500 },
                { id: 's_att5', group: '카페', name: '포트 리버 카페', category: '디저트카페', desc: '맛있는 타르트와 커피를 즐길 수 있는 아기자기한 카페입니다.', lat: 26.2300, lng: 127.6900 }
            ],
            central: [
                { id: 'c_att1', group: '관광지', name: '만좌모', category: '자연경관', desc: '코끼리 바위 모양의 기암괴석과 끝없이 펼쳐진 푸른 동중국해 바다를 조망할 수 있는 오키나와 대표 절경입니다.', lat: 26.5028, lng: 127.8464 },
                { id: 'c_att2', group: '관광지', name: '아메리칸 빌리지', category: '테마타운', desc: '미국 서해안 분위기를 재현한 이국적인 타운으로 대관람차와 아름다운 석양, 맛집이 가득합니다.', lat: 26.3160, lng: 127.7580 },
                { id: 'c_att3', group: '카페', name: 'Hاماتا 카페 (함자)', category: '오션뷰카페', desc: '바다가 한눈에 내려다보이는 여유로운 분위기의 오션뷰 카페입니다.', lat: 26.4300, lng: 127.7800 }
            ],
            north: [
                { id: 'n_att1', group: '관광지', name: '츄라우미 수족관', category: '수족관', desc: '거대한 고래상어와 만타가 헤엄치는 대형 수조로 세계적인 명성을 자랑하는 오키나와 북부 필수 코스입니다.', lat: 26.6944, lng: 127.8778 },
                { id: 'n_att2', group: '관광지', name: '코우리 대교 & 오션타워', category: '자연경관', desc: '에메랄드빛 바다 위를 시원하게 가로지르는 길게 뻗은 대교로 환상적인 드라이브 코스입니다.', lat: 26.6991, lng: 128.0245 },
                { id: 'n_att3', group: '카페', name: '츄라우테라스', category: '카페', desc: '코우리섬의 에메랄드빛 바다를 바라보며 커피를 즐길 수 있는 카페입니다.', lat: 26.6950, lng: 128.0200 }
            ]
        };

        // 로컬스토리지 JSON 파싱 시 발생할 수 있는 오류를 안전하게 방지
        let placesData = defaultPlacesData;
        try {
            const savedPlaces = localStorage.getItem('okinawa_placesData');
            if (savedPlaces) placesData = JSON.parse(savedPlaces);
        } catch(e) { console.error('기존 장소 데이터 로드 실패'); }

        let tripData = { startDate: '2026-12-27', endDate: '2026-12-31', days: [], activeDay: 0 };
        try {
            const savedTrip = localStorage.getItem('okinawa_tripData');
            if (savedTrip) tripData = JSON.parse(savedTrip);
        } catch(e) { console.error('기존 일정 데이터 로드 실패'); }

        let currentRegion = 'south'; 
        let currentCategory = '관광지';
        let addMode = 'place'; 

        let theMap = null; 
        let markerGroup = null; 

        window.onload = function() {
            document.getElementById('startDate').value = tripData.startDate || '2026-12-27';
            document.getElementById('endDate').value = tripData.endDate || '2026-12-31';
            generateDaysFromDates();
            renderPlaces();
            renderPlanner();
        };

        function saveDataToLocalStorage() {
            localStorage.setItem('okinawa_placesData', JSON.stringify(placesData));
            localStorage.setItem('okinawa_tripData', JSON.stringify(tripData));
        }

        function manualSaveData() {
            saveDataToLocalStorage();
            alert('일정이 브라우저에 안전하게 저장되었습니다!');
        }

        function exportBackupData() {
            const backupPayload = { version: "1.0", exportedAt: new Date().toLocaleString(), tripData: tripData, placesData: placesData };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
            const downloadAnchor = document.createElement('a');
            const today = new Date().toISOString().slice(0, 10);
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `okinawa_trip_backup_${today}.json`);
            document.body.appendChild(downloadAnchor); downloadAnchor.click(); downloadAnchor.remove();
        }

        function importBackupData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.tripData && imported.placesData) { tripData = imported.tripData; placesData = imported.placesData; }
                    else { tripData = imported; }
                    saveDataToLocalStorage();
                    if (tripData.startDate) document.getElementById('startDate').value = tripData.startDate;
                    if (tripData.endDate) document.getElementById('endDate').value = tripData.endDate;
                    generateDaysFromDates(); renderPlaces(); renderPlanner();
                    alert('백업 데이터가 성공적으로 복구되었습니다!');
                } catch (err) { alert('파일을 읽는 중 오류가 발생했습니다.'); }
                event.target.value = ''; 
            };
            reader.readAsText(file);
        }

        function generateDaysFromDates() {
            const start = new Date(document.getElementById('startDate').value || '2026-12-27');
            const end = new Date(document.getElementById('endDate').value || '2026-12-31');
            let timeDiff = end.getTime() - start.getTime();
            let dayCount = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
            if (isNaN(dayCount) || dayCount <= 0) dayCount = 1;
            const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
            let oldDays = tripData.days || [];
            let newDays = [];
            for (let i = 0; i < dayCount; i++) {
                let currDate = new Date(start);
                currDate.setDate(start.getDate() + i);
                let dateStr = `${currDate.getMonth() + 1}/${currDate.getDate()} (${weekNames[currDate.getDay()]})`;
                let existing = oldDays[i] || { events: [] };
                newDays.push({ dayNum: i + 1, date: dateStr, events: existing.events });
            }
            tripData.days = newDays;
            if (tripData.activeDay >= dayCount) tripData.activeDay = 0;
            saveDataToLocalStorage();
        }

        function calculateRouteInfo(lat1, lon1, lat2, lon2, mode) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return { distance: '알 수 없음', duration: '-' };
            const R = 6371; const dLat = (lat2 - lat1) * (Math.PI / 180); const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)); let d = R * c;
            let speed = mode === '택시' ? 35 : (mode === '버스' || mode === '모노레일') ? 25 : mode === '도보' ? 4 : 40;
            let hours = d / speed; let mins = Math.max(5, Math.round(hours * 60));
            return { distance: `${d.toFixed(1)} km`, duration: mins >= 60 ? `${Math.floor(mins/60)}시간 ${mins%60}분` : `${mins}분` };
        }

                    let moveUpBtn = subIdx > 0 ? `<button onclick="moveEvent(${evtIdx}, -1)" class="text-slate-400 hover:text-slate-700 w-full flex justify-center py-1 transition"><i class="fa-solid fa-chevron-up text-xs"></i></button>` : `<span class="py-1 w-full flex justify-center invisible"><i class="fa-solid fa-chevron-up text-xs"></i></span>`;
                    let moveDownBtn = subIdx < actualEvents.length - 1 ? `<button onclick="moveEvent(${evtIdx}, 1)" class="text-slate-400 hover:text-slate-700 w-full flex justify-center py-1 transition"><i class="fa-solid fa-chevron-down text-xs"></i></button>` : `<span class="py-1 w-full flex justify-center invisible"><i class="fa-solid fa-chevron-down text-xs"></i></span>`;

                    eventsHtml += `
                        <div class="flex items-center bg-white border-y border-x-0 border-slate-200 shadow-sm overflow-hidden py-3 px-4 sm:px-6 gap-3">
                            <div class="flex flex-col justify-center items-center w-7 bg-slate-50 rounded-lg border border-slate-100 shrink-0 py-0.5">${moveUpBtn}${moveDownBtn}</div>

                                <button onclick="removeEvent(${tripData.activeDay}, ${evtIdx})" class="text-rose-400 hover:bg-rose-50 w-8 h-8 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-trash-can text-sm"></i></button>

        // 전체 일정을 텍스트로 요약해서 클립보드에 복사하는 함수
        function copyScheduleToClipboard() {
            let text = `✈️ 오키나와 여행 일정 (${tripData.startDate} ~ ${tripData.endDate})\n\n`;
            
            tripData.days.forEach(d => {
                text += `[ Day ${d.dayNum} : ${d.date} ]\n`;
                if (!d.events || d.events.length === 0) {
                    text += `  - 등록된 일정이 없습니다.\n`;
                } else {
                    d.events.forEach((evt, i) => {
                        let icon = (evt.type === 'hotel' || evt.group === '호텔') ? '🏨' : '📍';
                        let trans = evt.transport ? `[${evt.transport}]` : '';
                        text += `  ${i+1}. ${icon} ${evt.name} ${trans}\n`;
                    });
                }
                text += `\n`;
            });
            text += `* 맞춤형 플래너에서 생성됨`;

            // 모바일 및 웹뷰 호환성을 위한 클립보드 처리
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert('전체 일정이 클립보드에 복사되었습니다!\n카카오톡 등에 붙여넣기 하세요.');
                }).catch(() => fallbackCopyTextToClipboard(text));
            } else {
                fallbackCopyTextToClipboard(text);
            }
        }

        function fallbackCopyTextToClipboard(text) {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                let successful = document.execCommand('copy');
                if (successful) alert('전체 일정이 클립보드에 복사되었습니다!\n카카오톡 등에 붙여넣기 하세요.');
                else alert('복사 실패. 브라우저가 클립보드 복사를 지원하지 않습니다.');
            } catch (err) { alert('복사 실패. 브라우저가 클립보드 복사를 지원하지 않습니다.'); }
            document.body.removeChild(textArea);
        }

        function setActiveDay(idx) { tripData.activeDay = idx; renderPlanner(); }
        function moveEvent(evtIdx, dir) {
            const evts = tripData.days[tripData.activeDay].events; const tgt = evtIdx + dir;
            if (tgt < 0 || tgt >= evts.length) return;
            let temp = evts[evtIdx]; evts[evtIdx] = evts[tgt]; evts[tgt] = temp;
            renderPlanner(); saveDataToLocalStorage();
        }
        function removeEvent(dayIdx, evtIdx) { tripData.days[dayIdx].events.splice(evtIdx, 1); renderPlanner(); saveDataToLocalStorage(); }
        function updateEventTransport(evtIdx, val) { tripData.days[tripData.activeDay].events[evtIdx].transport = val; renderPlanner(); saveDataToLocalStorage(); }

        function openTimelineAddModal(mode = 'place') {
            addMode = mode;
            document.getElementById('modal-title').innerHTML = mode === 'hotel' ? '<i class="fa-solid fa-bed mr-2"></i>숙소로 등록할 호텔 선택' : '<i class="fa-solid fa-calendar-plus mr-2"></i>방문 순서에 장소 추가';
            switchCategory(mode === 'hotel' ? '호텔' : '관광지');
            document.getElementById('timelineAddModal').classList.remove('hidden'); renderPlaces();
        }
        function closeTimelineAddModal() { document.getElementById('timelineAddModal').classList.add('hidden'); }
        function openAddModal() {
            document.getElementById('addPlaceModal').classList.remove('hidden');
            document.getElementById('customPlaceName').value = ''; document.getElementById('customLat').value = ''; document.getElementById('customLng').value = ''; document.getElementById('customPlaceDesc').value = '';
            if (addMode === 'hotel') document.getElementById('customPlaceGroup').value = '호텔';
            document.getElementById('customPlaceName').focus();
        }
        function closeAddModal() { document.getElementById('addPlaceModal').classList.add('hidden'); }

        function registerCustomPlace() {
            const name = document.getElementById('customPlaceName').value.trim(); const region = document.getElementById('customPlaceRegion').value;
            const group = document.getElementById('customPlaceGroup').value; const descVal = document.getElementById('customPlaceDesc').value.trim();
            let latVal = document.getElementById('customLat').value.trim(); let lngVal = document.getElementById('customLng').value.trim();
            if (!name) { alert('장소명을 입력해주세요.'); return; }

            let desc = descVal || '직접 등록한 맞춤형 장소입니다.';
            const regionCoords = { south: { lat: 26.21, lng: 127.68 }, central: { lat: 26.35, lng: 127.78 }, north: { lat: 26.65, lng: 127.90 } };
            
            // 좌표를 숫자로 확실하게 변환
            let latNum = parseFloat(latVal);
            let lngNum = parseFloat(lngVal);
            latNum = isNaN(latNum) ? regionCoords[region].lat : latNum;
            lngNum = isNaN(lngNum) ? regionCoords[region].lng : lngNum;

            const newPlace = { id: 'custom-' + Date.now(), group: group, name: name, category: group === '호텔' ? '호텔/숙소' : '구글 맵 명소', desc: desc, lat: latNum, lng: lngNum };

            if(!placesData[region]) placesData[region] = []; placesData[region].push(newPlace);
            switchRegion(region); switchCategory(group); renderPlaces(); saveDataToLocalStorage();

            let eventObj = JSON.parse(JSON.stringify(newPlace)); eventObj.type = (addMode === 'hotel' || group === '호텔') ? 'hotel' : 'place'; eventObj.transport = '렌터카';
            if (addMode === 'hotel' || group === '호텔') {
                if (tripData.days[tripData.activeDay].events.length > 0 && (tripData.days[tripData.activeDay].events[0].type === 'hotel' || tripData.days[tripData.activeDay].events[0].group === '호텔')) tripData.days[tripData.activeDay].events[0] = eventObj;
                else tripData.days[tripData.activeDay].events.unshift(eventObj);
            } else tripData.days[tripData.activeDay].events.push(eventObj);

            renderPlanner(); saveDataToLocalStorage(); closeAddModal(); closeTimelineAddModal();
        }

        // --- 내장 맵(Leaflet) 렌더링 함수 ---
        function openIntegratedMap(source) {
            if (typeof L === 'undefined') {
                alert('지도 라이브러리를 불러오지 못했습니다. 네트워크 상태를 확인해주세요.');
                return;
            }

            document.getElementById('integratedMapModal').classList.remove('hidden');
            
            // 모달이 완전히 뜬 후 맵 초기화 (크기 계산 오류 방지)
            setTimeout(() => {
                if (!theMap) {
                    theMap = L.map('leafletMapContainer').setView([26.4, 127.8], 10);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '&copy; OpenStreetMap contributors'
                    }).addTo(theMap);
                    markerGroup = L.layerGroup().addTo(theMap);
                } else {
                    theMap.invalidateSize(); 
                }
                
                markerGroup.clearLayers();
                let placesToShow = [];

                if (source === 'list') {
                    document.getElementById('integratedMapTitle').innerHTML = '<i class="fa-solid fa-map-location-dot mr-2"></i>목록 장소 한눈에 보기';
                    // 빈 배열 폴백 처리
                    placesToShow = (placesData[currentRegion] || []).filter(p => p.group === currentCategory);
                } else if (source === 'day') {
                    document.getElementById('integratedMapTitle').innerHTML = `<i class="fa-solid fa-map-location-dot mr-2"></i>Day ${tripData.days[tripData.activeDay].dayNum} 일정 한눈에 보기`;
                    placesToShow = tripData.days[tripData.activeDay].events.filter(e => e.lat && e.lng);
                }

                if (placesToShow.length === 0) {
                    alert('현재 지도에 표시할 좌표 정보가 없습니다.');
                    closeIntegratedMap();
                    return;
                }

                let bounds = L.latLngBounds();
                
                placesToShow.forEach((p, idx) => {
                    let lat = parseFloat(p.lat);
                    let lng = parseFloat(p.lng);
                    
                    if (!isNaN(lat) && !isNaN(lng)) {
                        let marker = L.marker([lat, lng]).addTo(markerGroup);
                        let popupHtml = `
                            <div style="min-width: 120px;">
                                <strong style="color:#0f172a; font-size:13px;">${source === 'day' ? (idx + 1) + '. ' : ''}${p.name}</strong><br>
                                <span style="font-size:11px; color:#64748b;">${p.category || '장소'}</span>
                            </div>
                        `;
                        marker.bindPopup(popupHtml);
                        bounds.extend([lat, lng]);
                    }
                });

                // 마커가 한눈에 들어오도록 줌 레벨과 위치 자동 조정
                theMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
            }, 100);
        }

        function closeIntegratedMap() {
            document.getElementById('integratedMapModal').classList.add('hidden');
        }
    </script>
