<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오키나와 완벽 맞춤형 여행 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans relative">

    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-600 to-blue-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure"></i> 오키나와 자유여행 플래너
                </h1>
                <p class="text-cyan-100 mt-1">타임라인 기반 일정 관리 및 구글 맵 연동</p>
            </div>
            <!-- 항공 및 날짜 설정 바 -->
            <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm flex flex-wrap gap-3 items-center text-sm">
                <div>
                    <label class="block text-xs text-cyan-200">출발 날짜</label>
                    <input type="date" id="startDate" value="2026-12-27" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <div>
                    <label class="block text-xs text-cyan-200">귀국 날짜</label>
                    <input type="date" id="endDate" value="2026-12-31" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <button onclick="updateTripSettings()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-3 py-1.5 rounded font-bold transition shadow self-end">설정 저장</button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        
        <!-- My Trip Planner (중앙 메인 배치) -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-suitcase-rolling text-cyan-600"></i> 나의 오키나와 타임라인
                </h2>
                <span id="trip-info-badge" class="text-sm bg-cyan-100 text-cyan-800 px-3 py-1.5 rounded-lg font-bold"></span>
            </div>

            <div class="mb-6">
                <div id="day-tabs" class="flex flex-wrap gap-2"></div>
            </div>

            <div id="day-content" class="space-y-4"></div>

            <div class="mt-8 pt-4 border-t border-slate-100 flex gap-3">
                <button onclick="manualSaveData()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-3 rounded-xl font-bold text-sm transition shadow-sm">
                    <i class="fa-solid fa-floppy-disk mr-1"></i> 현재 일정 전체 저장
                </button>
                <button onclick="resetPlanner()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-6 py-3 rounded-xl font-bold text-sm transition">
                    일정 초기화
                </button>
            </div>
        </div>

    </main>

    <!-- Timeline Add Modal (장소 탐색 및 일정 추가 통합 모달) -->
    <div id="timelineAddModal" class="hidden fixed inset-0 z-[50] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-gradient-to-r from-cyan-600 to-blue-700 px-6 py-4 flex justify-between items-center text-white shrink-0">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-calendar-plus mr-2"></i>타임라인에 장소 추가</h3>
                <button onclick="closeTimelineAddModal()" class="text-white/80 hover:text-white transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            
            <!-- 모달 내 탭 전환 -->
            <div class="flex bg-slate-100 p-1.5 m-4 mb-2 rounded-xl text-sm font-bold shrink-0">
                <button onclick="switchModalTab('browser')" id="modalTabBrowser" class="flex-1 py-2.5 rounded-lg bg-white text-cyan-700 shadow-sm transition">📍 오키나와 명소 탐색</button>
                <button onclick="switchModalTab('hotel')" id="modalTabHotel" class="flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition">🔍 숙소 / 기타 장소 검색</button>
            </div>

            <div class="p-6 overflow-y-auto bg-slate-50 flex-1">
                
                <!-- 탭 1: 오키나와 명소 탐색 브라우저 -->
                <div id="modalSectionBrowser" class="space-y-6">
                    <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
                        <span class="text-sm font-bold text-slate-700">원하는 명소를 찾아 일정에 바로 추가하세요.</span>
                        <button onclick="openAddModal()" class="bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5">
                            <i class="fa-solid fa-plus"></i> 신규 장소 직접 등록
                        </button>
                    </div>

                    <!-- 지역 탭 -->
                    <div class="flex bg-slate-200/70 p-1 rounded-xl">
                        <button onclick="switchRegion('south')" id="btn-south" class="flex-1 py-2 rounded-lg text-xs font-bold transition bg-white text-cyan-700 shadow-sm">남부</button>
                        <button onclick="switchRegion('central')" id="btn-central" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800">중부</button>
                        <button onclick="switchRegion('north')" id="btn-north" class="flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800">북부</button>
                    </div>

                    <!-- 카테고리 탭 -->
                    <div class="flex gap-2 border-b border-slate-200 pb-4">
                        <button onclick="switchCategory('관광지')" id="cat-관광지" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-cyan-600 text-white shadow-sm">🏞️ 관광지</button>
                        <button onclick="switchCategory('식당')" id="cat-식당" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">🍽️ 식당</button>
                        <button onclick="switchCategory('액티비티')" id="cat-액티비티" class="px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">🏄 액티비티</button>
                    </div>

                    <!-- 장소 카드 목록 -->
                    <div id="places-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- JS 렌더링 -->
                    </div>
                </div>

                <!-- 탭 2: 숙소 및 기타 검색/수동 추가 영역 -->
                <div id="modalSectionHotel" class="space-y-6 hidden bg-white p-5 rounded-xl border border-slate-200">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">장소/숙소명 검색 (OpenStreetMap)</label>
                        <div class="flex gap-1">
                            <input type="text" id="hsQuery" placeholder="예: 몬토레 오키나와" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cyan-500" onkeydown="if(event.key==='Enter') searchHotelApi()">
                            <button onclick="searchHotelApi()" class="bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2 rounded-lg transition"><i class="fa-solid fa-magnifying-glass"></i></button>
                        </div>
                    </div>
                    
                    <div class="border border-slate-200 rounded-lg overflow-hidden flex flex-col h-48">
                        <div class="bg-slate-100 px-3 py-2 border-b border-slate-200 text-xs font-bold text-slate-600 flex justify-between items-center">
                            <span>검색 결과</span>
                        </div>
                        <div id="hsResults" class="overflow-y-auto p-2 flex-1 text-sm bg-white relative">
                            <p class="text-slate-400 text-center mt-6 text-xs flex flex-col items-center gap-2">
                                <i class="fa-solid fa-hotel text-2xl text-slate-300"></i>
                                장소나 숙소 이름을 검색해주세요.
                            </p>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-100 space-y-3">
                        <label class="block text-xs font-bold text-slate-700"><i class="fa-solid fa-map-pin mr-1 text-rose-500"></i>검색이 안 되나요? 구글 맵 좌표로 직접 입력</label>
                        <div class="grid grid-cols-2 gap-3">
                            <input type="number" step="any" id="manualLat" placeholder="위도 (예: 26.2120)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500">
                            <input type="number" step="any" id="manualLng" placeholder="경도 (예: 127.6800)" class="border border-slate-300 rounded-lg px-3 py-2 text-sm outline-none focus:border-cyan-500">
                        </div>
                        <button onclick="addManualHotelWithCoords()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-sm">
                            입력한 좌표로 타임라인에 추가
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Custom Place Modal (신규 장소 직접 등록) -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[60] bg-slate-900/70 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-600 px-5 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-base"><i class="fa-solid fa-plus-circle mr-2"></i>명소 데이터 등록</h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">장소명</label>
                    <input type="text" id="customPlaceName" placeholder="예: 류큐무라" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">지역</label>
                        <select id="customPlaceRegion" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                            <option value="south">남부</option>
                            <option value="central">중부</option>
                            <option value="north">북부</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">분류</label>
                        <select id="customPlaceGroup" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white">
                            <option value="관광지">관광지</option>
                            <option value="식당">식당</option>
                            <option value="액티비티">액티비티</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex gap-2">
                    <button onclick="searchAndAddPlace()" id="customAddBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold text-sm transition">
                        목록에 등록
                    </button>
                    <button onclick="closeAddModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-lg font-bold text-sm transition">취소</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultPlacesData = {
            south: [
                { id: 's1', group: '관광지', name: '나하 공항', category: '교통/시작점', desc: '오키나와 남부 여행의 시작점이자 유이레일 출발지.', lat: 26.2056, lng: 127.6472 },
                { id: 's2', group: '관광지', name: '니라이카나이 다리 전망대', category: '자연경관', desc: '터널을 빠져나오는 순간 펼쳐지는 웅장한 바다 풍경 감상 코스.', lat: 26.1666, lng: 127.8189 },
                { id: 's3', group: '관광지', name: '치넨미사키 공원', category: '산책/공원', desc: '오키나와 남동부 끝자락, 태평양 바다의 탁 트인 250도 뷰를 볼 수 있는 공원.', lat: 26.1661, lng: 127.8315 },
                { id: 's4', group: '관광지', name: '오키나와 월드', category: '테마파크', desc: '전통 문화 체험 및 30만 년 된 거대한 교쿠센도 종유동굴 탐험.', lat: 26.1378, lng: 127.7516 },
                { id: 's5', group: '관광지', name: '세나가지마 우미카지 테라스', category: '복합몰', desc: '아름다운 바다와 노을, 새하얀 건물들이 어우러진 오키나와의 산토리니.', lat: 26.1738, lng: 127.6429 },
                { id: 's6', group: '식당', name: '야기야 (Yagiya)', category: '로컬맛집', desc: '전통 민가를 개조한 식당에서 맛보는 일품 오키나와 소바 전문점.', lat: 26.1350, lng: 127.7310 },
                { id: 's7', group: '식당', name: '하마베노차야', category: '오션뷰 카페', desc: '창밖으로 바로 바다가 펼쳐지는 낭만적인 티타임 명소.', lat: 26.1347, lng: 127.7816 },
                { id: 's8', group: '액티비티', name: '미바루 비치 글라스보트', category: '해양체험', desc: '배 밑바닥의 유리창을 통해 젖지 않고 남부 바다의 산호초와 열대어를 감상.', lat: 26.1332, lng: 127.7845 }
            ],
            central: [
                { id: 'c1', group: '관광지', name: '만좌모', category: '자연경관', desc: '코끼리 모양의 기암괴석과 푸른 동중국해 절경이 만나는 곳.', lat: 26.5028, lng: 127.8464 },
                { id: 'c2', group: '관광지', name: '아메리칸 빌리지', category: '테마/야경', desc: '미국 서해안 분위기의 이국적인 쇼핑몰, 대관람차(야경) 관람.', lat: 26.3160, lng: 127.7580 },
                { id: 'c3', group: '관광지', name: '잔파곶', category: '자연경관', desc: '거친 파도와 하얀 등대가 인상적인 웅장한 해안 절벽.', lat: 26.4385, lng: 127.7126 },
                { id: 'c4', group: '식당', name: '얏빠리 스테이크', category: '스테이크', desc: '용암석에 구워 먹는 가성비 훌륭한 든든한 스테이크 전문점.', lat: 26.2160, lng: 127.6830 },
                { id: 'c5', group: '식당', name: '단보라멘', category: '라멘', desc: '오키나와를 대표하는 돈코츠 라멘 맛집.', lat: 26.2172, lng: 127.6844 },
                { id: 'c6', group: '액티비티', name: '마에다 곶 푸른동굴 스노클링', category: '해양체험', desc: '대표 스노클링 명소! 신비로운 푸른 빛이 감도는 동굴 속 탐험.', lat: 26.4447, lng: 127.7719 }
            ],
            north: [
                { id: 'n1', group: '관광지', name: '츄라우미 수족관', category: '수족관', desc: '거대한 고래상어와 만타가 헤엄치는 대형 수조로 유명한 북부 핵심 명소.', lat: 26.6944, lng: 127.8778 },
                { id: 'n2', group: '관광지', name: '코우리 대교 & 오션타워', category: '자연경관', desc: '에메랄드빛 바다 위를 가로지르는 대교 드라이브 및 타워 조망.', lat: 26.6991, lng: 128.0245 },
                { id: 'n3', group: '관광지', name: '비세 후쿠기 가로수길', category: '산책코스', desc: '푸른 터널을 이루는 방풍림 사이로 자전거를 타거나 산책하기 좋은 곳.', lat: 26.7082, lng: 127.8756 },
                { id: 'n4', group: '식당', name: '백년고가 우후야', category: '향토음식', desc: '100년 된 전통 가옥에서 자연을 보며 즐기는 오키나와 아구(흑돼지) 소바.', lat: 26.6346, lng: 127.9620 },
                { id: 'n5', group: '식당', name: '캡틴 캥거루', category: '수제버거', desc: '압도적인 비주얼과 육즙을 자랑하는 북부 최고의 수제 버거 전문점.', lat: 26.6111, lng: 127.9405 },
                { id: 'n6', group: '액티비티', name: '세소코 비치 해수욕', category: '해양체험', desc: '고운 모래사장과 에메랄드빛 맑은 바다에서 즐기는 한적한 해수욕.', lat: 26.6534, lng: 127.8543 },
                { id: 'n7', group: '액티비티', name: '고릴라 촙 다이빙', category: '해양체험', desc: '초보자도 즐기기 좋은 산호와 열대어가 가득한 모토부 지역 다이빙 포인트.', lat: 26.6277, lng: 127.8767 }
            ]
        };

        let placesData = JSON.parse(localStorage.getItem('okinawa_placesData')) || defaultPlacesData;
        let currentRegion = 'south'; 
        let currentCategory = '관광지';

        let tripData = JSON.parse(localStorage.getItem('okinawa_tripData')) || {
            startDate: '2026-12-27',
            endDate: '2026-12-31',
            days: [], activeDay: 0
        };

        window.onload = function() {
            document.getElementById('startDate').value = tripData.startDate || '2026-12-27';
            document.getElementById('endDate').value = tripData.endDate || '2026-12-31';
            
            generateDaysFromDates();
            renderPlaces();
            renderPlanner();
        };

        function saveDataToLocalStorage() {
            localStorage.setItem('okinawa_placesData', JSON.stringify(placesData));
            localStorage.setItem('okinawa_tripData', JSON.stringify(tripData));
        }

        function manualSaveData() {
            saveDataToLocalStorage();
            alert('일정이 브라우저에 안전하게 저장되었습니다!');
        }

        function generateTimeOptions(selectedTime = "10:00") {
            let options = '';
            for(let h = 0; h < 24; h++) {
                for(let m = 0; m < 60; m += 30) {
                    let timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
                    let sel = (timeStr === selectedTime) ? 'selected' : '';
                    options += `<option value="${timeStr}" ${sel}>${timeStr}</option>`;
                }
            }
            return options;
        }

        function generateDaysFromDates() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            let timeDiff = end.getTime() - start.getTime();
            let dayCount = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
            if (isNaN(dayCount) || dayCount <= 0) dayCount = 1;

            const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
            let oldDays = tripData.days || [];
            let newDays = [];

            for (let i = 0; i < dayCount; i++) {
                let currDate = new Date(start);
                currDate.setDate(start.getDate() + i);
                let dateStr = `${currDate.getMonth() + 1}/${currDate.getDate()} (${weekNames[currDate.getDay()]})`;
                let existing = oldDays[i] || { events: [] };
                newDays.push({ dayNum: i + 1, date: dateStr, events: existing.events });
            }
            tripData.days = newDays;
            if (tripData.activeDay >= dayCount) tripData.activeDay = 0;
            saveDataToLocalStorage();
        }

        function updateTripSettings() {
            tripData.startDate = document.getElementById('startDate').value;
            tripData.endDate = document.getElementById('endDate').value;
            generateDaysFromDates();
            renderPlanner();
            alert('날짜 설정이 저장되었습니다.');
        }

        /* --- 모달 내 명소 탐색 브라우저 로직 --- */
        function switchRegion(region) {
            currentRegion = region;
            const activeClass = 'flex-1 py-2 rounded-lg text-xs font-bold transition bg-white text-cyan-700 shadow-sm';
            const inactiveClass = 'flex-1 py-2 rounded-lg text-xs font-bold transition text-slate-500 hover:text-slate-800';
            document.getElementById('btn-south').className = region === 'south' ? activeClass : inactiveClass;
            document.getElementById('btn-central').className = region === 'central' ? activeClass : inactiveClass;
            document.getElementById('btn-north').className = region === 'north' ? activeClass : inactiveClass;
            renderPlaces();
        }

        function switchCategory(category) {
            currentCategory = category;
            ['관광지', '식당', '액티비티'].forEach(cat => {
                const btn = document.getElementById(`cat-${cat}`);
                if (cat === category) {
                    btn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-cyan-600 text-white shadow-sm';
                } else {
                    btn.className = 'px-4 py-1.5 rounded-lg text-xs font-bold transition bg-white border border-slate-200 text-slate-600 hover:bg-slate-100';
                }
            });
            renderPlaces();
        }

        function renderPlaces() {
            const container = document.getElementById('places-container');
            const places = placesData[currentRegion] || [];
            const filteredPlaces = places.filter(p => p.group === currentCategory);

            let html = '';
            if (filteredPlaces.length === 0) {
                html = `<div class="col-span-1 sm:col-span-2 text-center py-12 text-slate-400 text-sm">해당 카테고리에 등록된 장소가 없습니다.</div>`;
            } else {
                filteredPlaces.forEach(p => {
                    html += `
                    <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col p-4 hover:border-cyan-300 transition">
                        <div class="flex justify-between items-start mb-2 gap-2">
                            <div class="flex items-start gap-2">
                                <button onclick="addPlaceFromBrowser('${p.id}')" class="shrink-0 bg-cyan-600 hover:bg-cyan-700 text-white text-[10px] font-bold py-1 px-1.5 rounded transition shadow-sm mt-0.5" title="일정에 추가">
                                    <i class="fa-solid fa-plus"></i> 추가
                                </button>
                                <h4 class="font-bold text-sm text-slate-900 leading-tight pt-0.5">${p.name}</h4>
                            </div>
                        </div>
                        <p class="text-xs text-slate-500 leading-relaxed">${p.desc}</p>
                    </div>
                    `;
                });
            }
            container.innerHTML = html;
        }

        function addPlaceFromBrowser(placeId) {
            let targetPlace = Object.values(placesData).flat().find(p => p.id === placeId);
            
            if(targetPlace) {
                let eventObj = JSON.parse(JSON.stringify(targetPlace));
                eventObj.type = 'place';
                eventObj.time = "10:00"; 
                eventObj.transport = '렌터카';
                
                tripData.days[tripData.activeDay].events.push(eventObj);
                tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));
                
                renderPlanner();
                saveDataToLocalStorage();
                
                alert(`[${targetPlace.name}] 장소가 Day ${tripData.days[tripData.activeDay].dayNum} 일정에 추가되었습니다! (시간은 타임라인에서 수정하세요)`);
            }
        }

        /* --- 타임라인 렌더링 로직 --- */
        function calculateRouteInfo(lat1, lon1, lat2, lon2, mode) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return { distance: '알 수 없음', duration: '-' };
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            let d = R * c;
            
            // 수단에 따른 속도 변경 적용 (대중교통 -> 버스/모노레일 분리)
            let speed = mode === '택시' ? 35 : (mode === '버스' || mode === '모노레일') ? 25 : mode === '도보' ? 4 : 40;
            let hours = d / speed;
            let mins = Math.max(5, Math.round(hours * 60));
            return { distance: `${d.toFixed(1)} km`, duration: mins >= 60 ? `${Math.floor(mins/60)}시간 ${mins%60}분` : `${mins}분` };
        }

        function renderPlanner() {
            const days = tripData.days || [];
            document.getElementById('trip-info-badge').innerText = `총 ${days.length}일 코스`;

            document.getElementById('day-tabs').innerHTML = days.map((d, idx) => `
                <button onclick="setActiveDay(${idx})" class="px-4 py-2 rounded-xl text-sm font-bold transition ${idx === tripData.activeDay ? 'bg-slate-800 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}">
                    Day ${d.dayNum}
                </button>
            `).join('');

            const contentContainer = document.getElementById('day-content');
            const currentDayObj = days[tripData.activeDay];
            if (!currentDayObj) return;

            let eventsHtml = '';
            let mapMarkers = []; 
            let coordIndex = 1;  
            let prevValidEvent = null;

            if (currentDayObj.events.length === 0) {
                eventsHtml = `
                    <div class="py-12 bg-white rounded-2xl border border-dashed border-slate-300 text-center flex flex-col items-center justify-center">
                        <i class="fa-solid fa-map-location-dot text-4xl text-slate-200 mb-3"></i>
                        <p class="text-sm text-slate-500 mb-4">등록된 일정이 없습니다.</p>
                        <button onclick="openTimelineAddModal()" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-4 py-2 rounded-lg shadow-sm transition">
                            명소 탐색 및 일정 추가하기
                        </button>
                    </div>`;
            } else {
                currentDayObj.events.forEach((evt, evtIdx) => {
                    const hasCoords = (evt.lat && evt.lng);
                    
                    if (hasCoords && prevValidEvent) {
                        let route = calculateRouteInfo(prevValidEvent.lat, prevValidEvent.lng, evt.lat, evt.lng, evt.transport || '렌터카');
                        eventsHtml += `
                            <div class="my-3 flex items-center justify-between bg-slate-100/70 px-4 py-2.5 rounded-xl text-xs text-slate-600 border border-slate-200/60 shadow-sm w-full">
                                <div class="flex items-center gap-2">
                                    <select onchange="updateEventTransport(${evtIdx}, this.value)" class="bg-white border border-slate-200 rounded-md px-2 py-1 outline-none text-slate-700 font-bold shadow-sm cursor-pointer hover:border-cyan-400 transition">
                                        <option value="렌터카" ${(evt.transport||'렌터카')==='렌터카'?'selected':''}>🚗 렌터카</option>
                                        <option value="택시" ${(evt.transport||'')==='택시'?'selected':''}>🚕 택시</option>
                                        <option value="버스" ${(evt.transport||'')==='버스'?'selected':''}>🚌 버스</option>
                                        <option value="모노레일" ${(evt.transport||'')==='모노레일'?'selected':''}>🚝 모노레일</option>
                                    </select>
                                </div>
                                <div class="flex items-center gap-4">
                                    <span>이동 거리: <strong class="text-slate-800">${route.distance}</strong></span>
                                    <span>예상 시간: <strong class="text-cyan-600">${route.duration}</strong></span>
                                </div>
                            </div>
                        `;
                    }

                    let displayNum = '';
                    if (hasCoords) {
                        displayNum = coordIndex++;
                        mapMarkers.push({ ...evt, num: displayNum });
                        prevValidEvent = evt;
                    }

                    const isHotel = evt.type === 'hotel';
                    const iconColor = isHotel ? 'bg-indigo-500' : 'bg-cyan-600';
                    const numCircle = displayNum ? `<span class="w-7 h-7 ${iconColor} text-white rounded-full flex items-center justify-center font-bold text-xs shadow-md shrink-0">${displayNum}</span>` : `<span class="w-7 h-7 ${iconColor} text-white rounded-full flex items-center justify-center font-bold text-xs shadow-md shrink-0"><i class="fa-solid fa-location-dot"></i></span>`;

                    const singleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(evt.name + ' 오키나와')}`;

                    // 위아래 이동 버튼
                    let moveUpBtn = evtIdx > 0 
                        ? `<button onclick="moveEvent(${evtIdx}, -1)" class="text-slate-400 hover:text-slate-700 w-full flex justify-center py-1 transition" title="위로 이동"><i class="fa-solid fa-chevron-up"></i></button>` 
                        : `<span class="py-1 w-full flex justify-center invisible"><i class="fa-solid fa-chevron-up"></i></span>`;
                    let moveDownBtn = evtIdx < currentDayObj.events.length - 1 
                        ? `<button onclick="moveEvent(${evtIdx}, 1)" class="text-slate-400 hover:text-slate-700 w-full flex justify-center py-1 transition" title="아래로 이동"><i class="fa-solid fa-chevron-down"></i></button>` 
                        : `<span class="py-1 w-full flex justify-center invisible"><i class="fa-solid fa-chevron-down"></i></span>`;

                    eventsHtml += `
                        <div class="flex items-stretch bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden group">
                            
                            <!-- 왼쪽 타임 슬롯 및 상하 이동버튼 -->
                            <div class="bg-slate-50 border-r border-slate-100 px-1 py-2 flex flex-col justify-center items-center w-24 shrink-0">
                                ${moveUpBtn}
                                <select onchange="updateEventTime(${evtIdx}, this.value)" class="text-sm font-extrabold text-slate-800 bg-transparent text-center outline-none cursor-pointer w-full my-0.5" title="시간 변경">
                                    ${generateTimeOptions(evt.time)}
                                </select>
                                ${moveDownBtn}
                            </div>
                            
                            <!-- 오른쪽 장소 정보 영역 -->
                            <div class="flex-1 p-4 flex items-center justify-between gap-3">
                                <div class="flex items-center gap-3 flex-1 min-w-0">
                                    ${numCircle}
                                    <h4 class="font-bold text-base text-slate-900 break-keep leading-snug">${evt.name}</h4>
                                </div>
                                <div class="flex items-center gap-2 shrink-0 opacity-100 sm:opacity-60 group-hover:opacity-100 transition-opacity">
                                    <a href="${singleMapUrl}" target="_blank" class="text-blue-500 hover:bg-blue-50 w-8 h-8 rounded-full flex items-center justify-center transition" title="구글 맵 보기"><i class="fa-solid fa-map-location-dot"></i></a>
                                    <button onclick="removeEvent(${tripData.activeDay}, ${evtIdx})" class="text-rose-400 hover:bg-rose-50 w-8 h-8 rounded-full flex items-center justify-center transition" title="일정 삭제"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            let googleMapLinkHtml = '';
            if (mapMarkers.length >= 2) {
                const origin = encodeURIComponent(mapMarkers[0].name + ' Okinawa');
                const destination = encodeURIComponent(mapMarkers[mapMarkers.length - 1].name + ' Okinawa');
                let waypointsStr = '';
                if (mapMarkers.length > 2) {
                    let wps = mapMarkers.slice(1, mapMarkers.length - 1).map(m => encodeURIComponent(m.name + ' Okinawa'));
                    waypointsStr = `&waypoints=${wps.join('|')}`;
                }
                const gmUrl = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}${waypointsStr}&travelmode=driving`;

                googleMapLinkHtml = `
                    <a href="${gmUrl}" target="_blank" class="block w-full mt-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-center py-3.5 rounded-xl text-sm font-bold shadow-md transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-map-location-dot"></i> 구글 맵스로 한글 전체 경로 (내비게이션) 열기
                    </a>
                `;
            }

            contentContainer.innerHTML = `
                <div class="bg-cyan-50/30 p-5 rounded-2xl border border-cyan-100/60 shadow-sm">
                    <div class="flex justify-between items-center pb-4 border-b border-cyan-100/60 mb-4">
                        <div>
                            <span class="font-extrabold text-2xl text-cyan-900">Day ${currentDayObj.dayNum}</span>
                            <span class="text-sm text-cyan-700 ml-2 font-medium">${currentDayObj.date}</span>
                        </div>
                        <button onclick="openTimelineAddModal()" class="bg-cyan-600 hover:bg-cyan-700 text-white text-sm font-bold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2">
                            <i class="fa-solid fa-plus"></i> 일정 추가
                        </button>
                    </div>

                    <div class="space-y-1">
                        ${eventsHtml}
                    </div>

                    ${googleMapLinkHtml}
                </div>
            `;
        }

        function setActiveDay(idx) { 
            tripData.activeDay = idx; 
            renderPlanner(); 
        }

        function moveEvent(evtIdx, direction) {
            const events = tripData.days[tripData.activeDay].events;
            const targetIdx = evtIdx + direction;
            if (targetIdx < 0 || targetIdx >= events.length) return;

            let temp = events[evtIdx];
            events[evtIdx] = events[targetIdx];
            events[targetIdx] = temp;

            renderPlanner();
            saveDataToLocalStorage();
        }

        function updateEventTime(evtIdx, newTime) {
            if (!newTime) return;
            tripData.days[tripData.activeDay].events[evtIdx].time = newTime;
            renderPlanner();
            saveDataToLocalStorage();
        }

        function removeEvent(dayIdx, evtIdx) {
            tripData.days[dayIdx].events.splice(evtIdx, 1);
            renderPlanner();
            saveDataToLocalStorage();
        }

        function updateEventTransport(evtIdx, val) { 
            tripData.days[tripData.activeDay].events[evtIdx].transport = val; 
            renderPlanner(); 
            saveDataToLocalStorage();
        }

        function resetPlanner() {
            if (confirm('모든 일정을 초기화하시겠습니까? (이 작업은 되돌릴 수 없습니다)')) {
                tripData.days.forEach(d => d.events = []);
                renderPlanner();
                saveDataToLocalStorage();
            }
        }

        /* --- 통합 모달 관리 --- */
        function openTimelineAddModal() {
            document.getElementById('timelineAddModal').classList.remove('hidden');
            
            // 숙소 탭 초기화
            document.getElementById('hsQuery').value = '';
            document.getElementById('manualLat').value = '';
            document.getElementById('manualLng').value = '';
            document.getElementById('hsResults').innerHTML = '<p class="text-slate-400 text-center mt-6 text-xs flex flex-col items-center gap-2"><i class="fa-solid fa-hotel text-2xl text-slate-300"></i>장소나 숙소 이름을 검색해주세요.</p>';
            
            renderPlaces(); // 브라우저 상태 최신화
            switchModalTab('browser');
        }

        function closeTimelineAddModal() {
            document.getElementById('timelineAddModal').classList.add('hidden');
        }

        function switchModalTab(tab) {
            const btnBrowser = document.getElementById('modalTabBrowser');
            const btnHotel = document.getElementById('modalTabHotel');
            const secBrowser = document.getElementById('modalSectionBrowser');
            const secHotel = document.getElementById('modalSectionHotel');

            if (tab === 'browser') {
                btnBrowser.className = 'flex-1 py-2.5 rounded-lg bg-white text-cyan-700 shadow-sm transition';
                btnHotel.className = 'flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
                secBrowser.classList.remove('hidden');
                secHotel.classList.add('hidden');
            } else {
                btnHotel.className = 'flex-1 py-2.5 rounded-lg bg-white text-cyan-700 shadow-sm transition';
                btnBrowser.className = 'flex-1 py-2.5 rounded-lg text-slate-600 hover:text-slate-900 transition';
                secHotel.classList.remove('hidden');
                secBrowser.classList.add('hidden');
            }
        }

        /* --- 신규 장소 직접 등록 (모달 위 모달) --- */
        function openAddModal() {
            document.getElementById('addPlaceModal').classList.remove('hidden');
            document.getElementById('customPlaceName').value = '';
            document.getElementById('customPlaceName').focus();
        }
        function closeAddModal() {
            document.getElementById('addPlaceModal').classList.add('hidden');
        }
        async function searchAndAddPlace() {
            const nameInput = document.getElementById('customPlaceName').value.trim();
            const region = document.getElementById('customPlaceRegion').value;
            const group = document.getElementById('customPlaceGroup').value;
            if (!nameInput) { alert('장소 이름을 입력해주세요.'); return; }

            const btn = document.getElementById('customAddBtn');
            btn.innerText = '처리 중...';
            btn.disabled = true;

            let desc = '사용자가 직접 추가한 맞춤 장소입니다.';
            try {
                const res = await fetch(`https://ko.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nameInput)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.extract) desc = data.extract.length > 70 ? data.extract.substring(0, 70) + '...' : data.extract;
                }
            } catch (e) { console.log('Wiki 검색 실패'); }

            const regionCoords = { south: { lat: 26.15, lng: 127.75 }, central: { lat: 26.35, lng: 127.80 }, north: { lat: 26.65, lng: 127.90 } };
            const newPlace = {
                id: 'custom-' + Date.now(), group: group, name: nameInput, category: '사용자 추가', desc: desc,
                lat: regionCoords[region].lat, lng: regionCoords[region].lng
            };

            if(!placesData[region]) placesData[region] = [];
            placesData[region].push(newPlace);
            
            closeAddModal();
            switchRegion(region); 
            switchCategory(group);
            renderPlaces();
            saveDataToLocalStorage();

            btn.innerText = '목록에 등록';
            btn.disabled = false;
        }

        /* --- OSM 숙소 검색 및 수동 입력 로직 --- */
        async function searchHotelApi() {
            const query = document.getElementById('hsQuery').value.trim();
            if(!query) { alert('검색어를 입력해주세요.'); return; }
            
            const resultsContainer = document.getElementById('hsResults');
            resultsContainer.innerHTML = '<p class="text-slate-500 text-center text-xs mt-6"><i class="fa-solid fa-spinner fa-spin mr-2"></i>검색 중...</p>';
            
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Okinawa')}&limit=10`);
                const data = await res.json();
                
                if(data.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-rose-500 text-center text-xs mt-6">검색 결과가 없습니다.<br>하단의 좌표 수동 입력을 이용해주세요.</p>';
                    return;
                }
                
                let html = '';
                data.forEach(item => {
                    let name = item.display_name.split(',')[0];
                    let address = item.display_name.split(',').slice(1).join(',').trim();
                    
                    html += `
                        <div class="flex justify-between items-center p-3 border-b border-slate-100 hover:bg-slate-50 transition">
                            <div class="text-xs flex-1 pr-3">
                                <strong class="text-slate-800 text-[13px] block mb-0.5">${name}</strong>
                                <p class="text-[11px] text-slate-400 truncate" title="${address}">${address}</p>
                            </div>
                            <button onclick="selectHotelAndAdd('${name.replace(/'/g, "\\'")}', ${item.lat}, ${item.lon})" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 rounded text-xs font-bold whitespace-nowrap transition shadow-sm">
                                선택 추가
                            </button>
                        </div>
                    `;
                });
                resultsContainer.innerHTML = html;
            } catch(e) {
                resultsContainer.innerHTML = '<p class="text-rose-500 text-center text-xs mt-6">검색 중 오류가 발생했습니다.</p>';
            }
        }

        function selectHotelAndAdd(name, lat, lng) {
            const newItem = {
                id: 'item-' + Date.now(), type: 'hotel', time: '18:00', // 기본 배정 시간
                name: name, group: '숙소/기타', lat: parseFloat(lat), lng: parseFloat(lng)
            };
            tripData.days[tripData.activeDay].events.push(newItem);
            tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));

            renderPlanner();
            saveDataToLocalStorage();
            alert(`[${name}] 이(가) 추가되었습니다! (시간은 타임라인에서 수정하세요)`);
        }

        function addManualHotelWithCoords() {
            const nameVal = document.getElementById('hsQuery').value.trim();
            const latVal = parseFloat(document.getElementById('manualLat').value);
            const lngVal = parseFloat(document.getElementById('manualLng').value);

            if(!nameVal) { alert('장소명을 검색창에 먼저 입력해주세요.'); return; }
            if(isNaN(latVal) || isNaN(lngVal)) { alert('올바른 위도와 경도 좌표를 입력해주세요.'); return; }

            const newItem = {
                id: 'item-' + Date.now(), type: 'hotel', time: '18:00', // 기본 배정 시간
                name: nameVal, group: '숙소/기타', lat: latVal, lng: lngVal
            };

            tripData.days[tripData.activeDay].events.push(newItem);
            tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));

            renderPlanner();
            saveDataToLocalStorage();
            alert(`입력하신 좌표로 [${nameVal}] 이(가) 추가되었습니다!`);
            
            document.getElementById('manualLat').value = '';
            document.getElementById('manualLng').value = '';
        }
    </script>
</body>
