<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오키나와 완벽 맞춤형 여행 플래너</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans relative">

    <!-- Header -->
    <header class="bg-gradient-to-r from-cyan-600 to-blue-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-3xl font-bold flex items-center gap-2">
                    <i class="fa-solid fa-plane-departure"></i> 오키나와 자유여행 플래너
                </h1>
                <p class="text-cyan-100 mt-1">남부→ 중부→ 북부 순서의 타임라인 일정 및 구글 맵 연동</p>
            </div>
            <!-- 항공 및 날짜 설정 바 -->
            <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm flex flex-wrap gap-3 items-center text-sm">
                <div>
                    <label class="block text-xs text-cyan-200">출발 날짜</label>
                    <input type="date" id="startDate" value="2026-12-27" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <div>
                    <label class="block text-xs text-cyan-200">귀국 날짜</label>
                    <input type="date" id="endDate" value="2026-12-31" class="bg-white text-slate-800 px-2 py-1 rounded font-medium">
                </div>
                <button onclick="updateTripSettings()" class="bg-cyan-500 hover:bg-cyan-400 text-white px-3 py-1.5 rounded font-bold transition shadow self-end">설정 저장</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Left Column: Places Browser -->
        <div class="lg:col-span-7 space-y-8">
            <section class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 border-b border-slate-100 pb-4">
                    <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-location-dot text-cyan-600"></i> 오키나와 명소 탐색
                    </h2>
                    
                    <button onclick="openAddModal()" class="bg-indigo-50 border border-indigo-200 text-indigo-700 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-sm font-bold transition shadow-sm flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 신규 장소 직접 등록
                    </button>
                </div>

                <!-- 1단계: 지역별 탭 (남부 / 중부 / 북부) -->
                <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-6">
                    <button onclick="switchRegion('south')" id="btn-south" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition bg-white text-cyan-700 shadow-sm">📍 남부</button>
                    <button onclick="switchRegion('central')" id="btn-central" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition text-slate-600 hover:text-slate-900">📍 중부</button>
                    <button onclick="switchRegion('north')" id="btn-north" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition text-slate-600 hover:text-slate-900">📍 북부</button>
                </div>

                <!-- 2단계: 카테고리별 서브 탭 (관광지 / 식당 / 액티비티) -->
                <div class="flex gap-2 border-b border-slate-100 pb-4 mb-6">
                    <button onclick="switchCategory('관광지')" id="cat-관광지" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-cyan-600 text-white shadow-sm">🏞️ 관광지</button>
                    <button onclick="switchCategory('식당')" id="cat-식당" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200">🍽️ 식당</button>
                    <button onclick="switchCategory('액티비티')" id="cat-액티비티" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-100 text-slate-600 hover:bg-slate-200">🏄 액티비티</button>
                </div>

                <!-- 장소 카드 목록 영역 -->
                <div id="places-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Javascript 동적 렌더링 -->
                </div>
            </section>
        </div>

        <!-- Right Column: My Trip Planner -->
        <div class="lg:col-span-5">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 sticky top-6">
                <div class="flex justify-between items-center mb-4 pb-3 border-b border-slate-100">
                    <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                        <i class="fa-solid fa-suitcase-rolling text-cyan-600"></i> 타임라인 & 구글 맵 연동
                    </h2>
                    <span id="trip-info-badge" class="text-xs bg-cyan-100 text-cyan-800 px-2 py-1 rounded font-medium"></span>
                </div>

                <div class="mb-4">
                    <div id="day-tabs" class="flex flex-wrap gap-1.5"></div>
                </div>

                <div id="day-content" class="space-y-4"></div>

                <div class="mt-6 pt-4 border-t border-slate-100 flex gap-2">
                    <button onclick="manualSaveData()" class="flex-1 bg-cyan-600 hover:bg-cyan-700 text-white py-2.5 rounded-xl font-bold text-sm transition shadow-sm">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> 일정 저장
                    </button>
                    <button onclick="resetPlanner()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2.5 rounded-xl font-bold text-sm transition">
                        초기화
                    </button>
                </div>
            </div>
        </div>

    </main>

    <!-- Custom Place Modal (신규 장소 등록) -->
    <div id="addPlaceModal" class="hidden fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden">
            <div class="bg-gradient-to-r from-indigo-500 to-cyan-500 px-6 py-4 flex justify-between items-center text-white">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-magnifying-glass-location mr-2"></i>새로운 장소 검색 및 추가</h3>
                <button onclick="closeAddModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">장소명</label>
                    <input type="text" id="customPlaceName" placeholder="예: 국제거리, 슈리성" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">지역</label>
                        <select id="customPlaceRegion" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                            <option value="south">남부</option>
                            <option value="central">중부</option>
                            <option value="north">북부</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">분류</label>
                        <select id="customPlaceGroup" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
                            <option value="관광지">관광지</option>
                            <option value="식당">식당</option>
                            <option value="액티비티">액티비티</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex gap-2">
                    <button onclick="searchAndAddPlace()" id="customAddBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold text-sm transition">
                        검색 및 추가
                    </button>
                    <button onclick="closeAddModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-4 py-2 rounded-lg font-bold text-sm transition">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Timeline Item Add / Hotel Search Modal (타임라인 일정추가 모달) -->
    <div id="hotelSearchModal" class="hidden fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-xl overflow-hidden flex flex-col">
            <div class="bg-gradient-to-r from-indigo-500 to-cyan-600 px-6 py-4 flex justify-between items-center text-white shrink-0">
                <h3 id="modalMainTitle" class="font-bold text-lg"><i class="fa-solid fa-calendar-plus mr-2"></i>타임라인 일정 추가</h3>
                <button onclick="closeHotelSearchModal()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <!-- 탭 전환 (등록된 장소 선택 / 숙소 검색 및 직접 추가) -->
            <div class="flex bg-slate-100 p-1 m-4 mb-0 rounded-xl text-xs font-bold">
                <button onclick="switchModalTab('registered')" id="modalTabRegistered" class="flex-1 py-2 rounded-lg bg-white text-cyan-700 shadow-sm transition">등록된 명소에서 고르기</button>
                <button onclick="switchModalTab('hotelOrCustom')" id="modalTabHotel" class="flex-1 py-2 rounded-lg text-slate-600 hover:text-slate-900 transition">숙소/기타 장소 검색·추가</button>
            </div>

            <div class="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                <!-- 탭 1: 등록된 장소 선택 영역 -->
                <div id="modalSectionRegistered" class="space-y-3">
                    <p class="text-xs text-slate-500">좌측 '오키나와 명소 탐색'에 등록된 장소 중 하나를 선택해 현재 Day 일정에 추가합니다.</p>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">방문 시간</label>
                        <select id="modalRegTime" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-cyan-500">
                            <!-- JS 24시간 -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">장소 선택</label>
                        <select id="modalRegPlaceSelect" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white outline-none focus:border-cyan-500">
                            <!-- JS 동적 생성 -->
                        </select>
                    </div>
                    <button onclick="addRegisteredPlaceToTimeline()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white py-2.5 rounded-lg font-bold text-sm transition shadow-sm mt-2">
                        선택한 장소를 타임라인에 추가
                    </button>
                </div>

                <!-- 탭 2: 숙소 및 기타 검색/수동 추가 영역 -->
                <div id="modalSectionHotel" class="space-y-4 hidden">
                    <div class="flex gap-3">
                        <div class="w-1/3">
                            <label class="block text-xs font-bold text-slate-700 mb-1">방문 시간</label>
                            <select id="hsTime" class="w-full border border-slate-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:border-indigo-500 bg-white">
                                <!-- JS로 24시간 옵션 생성 -->
                            </select>
                        </div>
                        <div class="w-2/3">
                            <label class="block text-xs font-bold text-slate-700 mb-1">장소/호텔명 검색</label>
                            <div class="flex gap-1">
                                <input type="text" id="hsQuery" placeholder="예: 몬토레, 숙소명" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') searchHotelApi()">
                                <button onclick="searchHotelApi()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-2 rounded-lg transition"><i class="fa-solid fa-magnifying-glass"></i></button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="border border-slate-200 rounded-lg overflow-hidden flex flex-col h-32">
                        <div class="bg-slate-50 px-3 py-2 border-b border-slate-200 text-xs font-bold text-slate-600 flex justify-between items-center">
                            <span>검색 결과</span>
                            <span class="text-[10px] font-normal text-slate-400">OpenStreetMap 기반</span>
                        </div>
                        <div id="hsResults" class="overflow-y-auto p-2 flex-1 text-sm bg-white relative">
                            <p class="text-slate-400 text-center mt-4 text-xs absolute inset-0 flex items-start justify-center pt-2">장소나 호텔 이름을 검색해주세요.</p>
                        </div>
                    </div>

                    <div class="pt-2 border-t border-slate-100 space-y-2">
                        <label class="block text-xs font-bold text-indigo-700"><i class="fa-solid fa-map-pin mr-1"></i>검색이 안 되나요? 구글 맵 좌표로 수동 추가</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" step="any" id="manualLat" placeholder="위도 (예: 26.2120)" class="border border-slate-300 rounded px-2 py-1.5 text-xs outline-none focus:border-indigo-500">
                            <input type="number" step="any" id="manualLng" placeholder="경도 (예: 127.6800)" class="border border-slate-300 rounded px-2 py-1.5 text-xs outline-none focus:border-indigo-500">
                        </div>
                        <button onclick="addManualHotelWithCoords()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg font-bold text-xs transition shadow-sm">
                            입력한 이름과 좌표로 타임라인 추가
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const defaultPlacesData = {
            south: [
                { id: 's1', group: '관광지', name: '나하 공항', category: '교통/시작점', desc: '오키나와 남부 여행의 시작점이자 유이레일 출발지.', lat: 26.2056, lng: 127.6472 },
                { id: 's2', group: '관광지', name: '니라이카나이 다리 전망대', category: '자연경관', desc: '터널을 빠져나오는 순간 펼쳐지는 웅장한 바다 풍경 감상 코스.', lat: 26.1666, lng: 127.8189 },
                { id: 's3', group: '관광지', name: '치넨미사키 공원', category: '산책/공원', desc: '오키나와 남동부 끝자락, 태평양 바다의 탁 트인 250도 뷰를 볼 수 있는 공원.', lat: 26.1661, lng: 127.8315 },
                { id: 's4', group: '관광지', name: '오키나와 월드', category: '테마파크', desc: '전통 문화 체험 및 30만 년 된 거대한 교쿠센도 종유동굴 탐험.', lat: 26.1378, lng: 127.7516 },
                { id: 's5', group: '관광지', name: '세나가지마 우미카지 테라스', category: '복합몰', desc: '아름다운 바다와 노을, 새하얀 건물들이 어우러진 오키나와의 산토리니.', lat: 26.1738, lng: 127.6429 },
                { id: 's6', group: '식당', name: '야기야 (Yagiya)', category: '로컬맛집', desc: '전통 민가를 개조한 식당에서 맛보는 일품 오키나와 소바 전문점.', lat: 26.1350, lng: 127.7310 },
                { id: 's7', group: '식당', name: '하마베노차야', category: '오션뷰 카페', desc: '창밖으로 바로 바다가 펼쳐지는 낭만적인 티타임 명소.', lat: 26.1347, lng: 127.7816 },
                { id: 's8', group: '액티비티', name: '미바루 비치 글라스보트', category: '해양체험', desc: '배 밑바닥의 유리창을 통해 젖지 않고 남부 바다의 산호초와 열대어를 감상.', lat: 26.1332, lng: 127.7845 }
            ],
            central: [
                { id: 'c1', group: '관광지', name: '만좌모', category: '자연경관', desc: '코끼리 모양의 기암괴석과 푸른 동중국해 절경이 만나는 곳.', lat: 26.5028, lng: 127.8464 },
                { id: 'c2', group: '관광지', name: '아메리칸 빌리지', category: '테마/야경', desc: '미국 서해안 분위기의 이국적인 쇼핑몰, 대관람차(야경) 관람.', lat: 26.3160, lng: 127.7580 },
                { id: 'c3', group: '관광지', name: '잔파곶', category: '자연경관', desc: '거친 파도와 하얀 등대가 인상적인 웅장한 해안 절벽.', lat: 26.4385, lng: 127.7126 },
                { id: 'c4', group: '식당', name: '얏빠리 스테이크', category: '스테이크', desc: '용암석에 구워 먹는 가성비 훌륭한 든든한 스테이크 전문점.', lat: 26.2160, lng: 127.6830 },
                { id: 'c5', group: '식당', name: '단보라멘', category: '라멘', desc: '오키나와를 대표하는 돈코츠 라멘 맛집.', lat: 26.2172, lng: 127.6844 },
                { id: 'c6', group: '액티비티', name: '마에다 곶 푸른동굴 스노클링', category: '해양체험', desc: '대표 스노클링 명소! 신비로운 푸른 빛이 감도는 동굴 속 탐험.', lat: 26.4447, lng: 127.7719 }
            ],
            north: [
                { id: 'n1', group: '관광지', name: '츄라우미 수족관', category: '수족관', desc: '거대한 고래상어와 만타가 헤엄치는 대형 수조로 유명한 북부 핵심 명소.', lat: 26.6944, lng: 127.8778 },
                { id: 'n2', group: '관광지', name: '코우리 대교 & 오션타워', category: '자연경관', desc: '에메랄드빛 바다 위를 가로지르는 대교 드라이브 및 타워 조망.', lat: 26.6991, lng: 128.0245 },
                { id: 'n3', group: '관광지', name: '비세 후쿠기 가로수길', category: '산책코스', desc: '푸른 터널을 이루는 방풍림 사이로 자전거를 타거나 산책하기 좋은 곳.', lat: 26.7082, lng: 127.8756 },
                { id: 'n4', group: '식당', name: '백년고가 우후야', category: '향토음식', desc: '100년 된 전통 가옥에서 자연을 보며 즐기는 오키나와 아구(흑돼지) 소바.', lat: 26.6346, lng: 127.9620 },
                { id: 'n5', group: '식당', name: '캡틴 캥거루', category: '수제버거', desc: '압도적인 비주얼과 육즙을 자랑하는 북부 최고의 수제 버거 전문점.', lat: 26.6111, lng: 127.9405 },

        function generateTimeOptions(selectedTime = "10:00") {
            let options = '';
            for(let h = 0; h < 24; h++) {

                    let timeStr = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;

                    options += `<option value="${timeStr}" ${sel}>${timeStr}</option>`;

            }
            return options;

        function generateDaysFromDates() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            let timeDiff = end.getTime() - start.getTime();
            let dayCount = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1;
            if (isNaN(dayCount) || dayCount <= 0) dayCount = 1;

            const weekNames = ['일', '월', '화', '수', '목', '금', '토'];
            let oldDays = tripData.days || [];
            let newDays = [];

            for (let i = 0; i < dayCount; i++) {
                let currDate = new Date(start);
                currDate.setDate(start.getDate() + i);
                let dateStr = `${currDate.getMonth() + 1}/${currDate.getDate()} (${weekNames[currDate.getDay()]}바이)`;
                let existing = oldDays[i] || { events: [] };
                newDays.push({ dayNum: i + 1, date: dateStr, events: existing.events });
            }
            tripData.days = newDays;
            if (tripData.activeDay >= dayCount) tripData.activeDay = 0;
            saveDataToLocalStorage();
        }

        function calculateRouteInfo(lat1, lon1, lat2, lon2, mode) {
            if (!lat1 || !lon1 || !lat2 || !lon2) return { distance: '알 수 없음', duration: '-' };
            const R = 6371;
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            let d = R * c;
            let speed = mode === '택시' ? 35 : mode === '대중교통' ? 25 : mode === '도보' ? 4 : 40;
            let hours = d / speed;
            let mins = Math.max(5, Math.round(hours * 60));
            return { distance: `${d.toFixed(1)} km`, duration: mins >= 60 ? `${Math.floor(mins/60)}시간 ${mins%60}분` : `${mins}분` };
        }

                    let moveDownBtn = evtIdx < currentDayObj.events.length - 1 ? `<button onclick="moveEvent(${evtIdx}, 1)" class="text-slate-400 hover:text-slate-700 px-1 py-1" title="아래로 이동"><i class="fa-solid fa-arrow-down"></i></button>` : '';

        // 순서 변경 함수 (위/아래)
        function moveEvent(evtIdx, direction) {
            const events = tripData.days[tripData.activeDay].events;
            const targetIdx = evtIdx + direction;
            if (targetIdx < 0 || targetIdx >= events.length) return;

            let temp = events[evtIdx];
            events[evtIdx] = events[targetIdx];
            events[targetIdx] = temp;

            renderPlanner();
            saveDataToLocalStorage();
        }

        function updateEventTime(evtIdx, newTime) {
            if (!newTime) return;
            tripData.days[tripData.activeDay].events[evtIdx].time = newTime;
            renderPlanner();
            saveDataToLocalStorage();
        }

        function removeEvent(dayIdx, evtIdx) {
            tripData.days[dayIdx].events.splice(evtIdx, 1);
            renderPlanner();
            saveDataToLocalStorage();
        }

        function updateEventTransport(evtIdx, val) { 
            tripData.days[tripData.activeDay].events[evtIdx].transport = val; 
            renderPlanner(); 
            saveDataToLocalStorage();

        async function searchAndAddPlace() {
            const nameInput = document.getElementById('customPlaceName').value.trim();
            const region = document.getElementById('customPlaceRegion').value;
            const group = document.getElementById('customPlaceGroup').value;
            if (!nameInput) { alert('장소 이름을 입력해주세요.'); return; }

            const btn = document.getElementById('customAddBtn');
            btn.innerText = '검색 중...';
            btn.disabled = true;

            let desc = '사용자가 직접 추가한 맞춤 장소입니다.';
            try {
                const res = await fetch(`https://ko.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(nameInput)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.extract) desc = data.extract.length > 70 ? data.extract.substring(0, 70) + '...' : data.extract;
                }
            } catch (e) { console.log('검색 실패'); }

            const regionCoords = { south: { lat: 26.15, lng: 127.75 }, central: { lat: 26.35, lng: 127.80 }, north: { lat: 26.65, lng: 127.90 } };
            const newPlace = {
                id: 'custom-' + Date.now(), group: group, name: nameInput, category: '사용자 추가', desc: desc,
                lat: regionCoords[region].lat, lng: regionCoords[region].lng
            };

            if(!placesData[region]) placesData[region] = [];
            placesData[region].push(newPlace);
            
            closeAddModal();
            switchRegion(region);

            renderPlaces();
            saveDataToLocalStorage();

            btn.innerText = '검색 및 추가';
            btn.disabled = false;

        // 등록된 명소에서 선택하여 타임라인에 추가
        function addRegisteredPlaceToTimeline() {
            const placeId = document.getElementById('modalRegPlaceSelect').value;
            const timeVal = document.getElementById('modalRegTime').value;
            if(!placeId) { alert('추가할 장소를 선택해주세요.'); return; }

            let targetPlace = null;
            Object.values(placesData).forEach(arr => {
                let found = arr.find(p => p.id === placeId);
                if(found) targetPlace = found;
            });

            if(targetPlace) {
                let eventObj = JSON.parse(JSON.stringify(targetPlace));
                eventObj.type = 'place';
                eventObj.time = timeVal;
                eventObj.transport = '렌터카';
                tripData.days[tripData.activeDay].events.push(eventObj);
                
                // 시간순 정렬 유지
                tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));

                closeHotelSearchModal();
                renderPlanner();
                saveDataToLocalStorage();
            }
        }

        async function searchHotelApi() {
            const query = document.getElementById('hsQuery').value.trim();
            if(!query) { alert('검색어를 입력해주세요.'); return; }

            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Okinawa')}&limit=10`);
                const data = await res.json();
                
                if(data.length === 0) {
                    resultsContainer.innerHTML = '<p class="text-rose-500 text-center text-xs mt-4 absolute inset-0 flex flex-col items-center justify-start pt-2">검색 결과가 없습니다.<br>하단의 좌표 수동 입력을 이용해주세요.</p>';
                    return;
                }
                
                let html = '';
                data.forEach(item => {
                    let name = item.display_name.split(',')[0];
                    let address = item.display_name.split(',').slice(1).join(',').trim();
                    
                    html += `
                        <div class="flex justify-between items-center p-2 border-b border-slate-100 hover:bg-slate-50 transition">
                            <div class="text-xs truncate flex-1 pr-2" title="${item.display_name}">
                                <strong class="text-indigo-700 text-[12px]">${name}</strong>
                                <p class="text-[10px] text-slate-400 truncate">${address}</p>
                            </div>
                            <button onclick="selectHotelAndAdd('${name.replace(/'/g, "\\'")}', ${item.lat}, ${item.lon})" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-2.5 py-1 rounded text-xs font-bold whitespace-nowrap transition shadow-sm">
                                선택
                            </button>
                        </div>
                    `;
                });
                resultsContainer.innerHTML = html;
            } catch(e) {
                resultsContainer.innerHTML = '<p class="text-rose-500 text-center text-xs mt-4 absolute inset-0 flex items-start justify-center pt-2">검색 중 오류가 발생했습니다.</p>';
            }
        }

        function selectHotelAndAdd(name, lat, lng) {
            const timeVal = document.getElementById('hsTime').value;
            const newItem = {
                id: 'item-' + Date.now(), type: 'hotel', time: timeVal || '18:00',
                name: name, group: '숙소/기타', lat: parseFloat(lat), lng: parseFloat(lng)
            };
            tripData.days[tripData.activeDay].events.push(newItem);
            tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));

            closeHotelSearchModal();
            renderPlanner();
            saveDataToLocalStorage();
        }

        function addManualHotelWithCoords() {
            const timeVal = document.getElementById('hsTime').value;
            const nameVal = document.getElementById('hsQuery').value.trim();
            const latVal = parseFloat(document.getElementById('manualLat').value);
            const lngVal = parseFloat(document.getElementById('manualLng').value);

            if(!nameVal) { alert('장소명을 입력해주세요.'); return; }
            if(isNaN(latVal) || isNaN(lngVal)) { alert('올바른 위도와 경도 좌표를 입력해주세요.'); return; }

            const newItem = {
                id: 'item-' + Date.now(), type: 'hotel', time: timeVal || '18:00',
                name: nameVal, group: '숙소/기타', lat: latVal, lng: lngVal
            };

            tripData.days[tripData.activeDay].events.push(newItem);
            tripData.days[tripData.activeDay].events.sort((a, b) => a.time.localeCompare(b.time));

            closeHotelSearchModal();
            renderPlanner();
            saveDataToLocalStorage();
        }
    </script>
</body>
</html>
